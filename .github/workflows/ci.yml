name: CI

on:
  pull_request:
  push:
    branches:
    - master
    - main

jobs:
  ci:
    name: Run tests and linting
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - ecommerce_repository: fccn/ecommerce
            ecommerce_ref: nau/teak.master
            # The tests of the asynchronous payment flow exercise the real
            # `paygate.pending_orders`, so the plugin has to be installed.
            paygate_repository: fccn/ecommerce-plugin-paygate
            paygate_ref: main
            pip_constraint: 
            # https://github.com/overhangio/tutor-ecommerce/blob/de58c6d53a30b3e61bb4fed899ffe15a363014c8/tutorecommerce/templates/ecommerce/build/ecommerce/Dockerfile#L49C20-L49C26
            python_version: 3.12

    steps:
      - name: Checkout Ecommerce NAU extensions
        uses: actions/checkout@v4
        with:
          # Relative path to place the repository
          path: ecommerce-nau-extensions

      - name: Checkout ecommerce
        uses: actions/checkout@v4
        with:
          # Repository name with owner
          repository: ${{ matrix.ecommerce_repository }}
          # Change the branch to checkout
          ref: ${{ matrix.ecommerce_ref }}
          # Relative path to place the repository
          path: ecommerce

      - name: Checkout PayGate
        uses: actions/checkout@v4
        with:
          # Repository name with owner
          repository: ${{ matrix.paygate_repository }}
          # Change the branch to checkout
          ref: ${{ matrix.paygate_ref }}
          # Relative path to place the repository
          path: ecommerce-plugin-paygate

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python_version }}'
          cache: 'pip' # caching pip dependencies

      - name: Install specific pip version
        if: "${{ matrix.pip_constraint != '' }}"
        run: pip install "${{ matrix.pip_constraint }}"

      - name: Patch ecommerce requirements for Python 3.12
        run: |
          echo "Patching ecommerce requirements for Python 3.12 compatibility"
          sed -i 's/nodeenv==1\.1\.1/nodeenv==1.10.0/g' ecommerce/requirements/production.txt
          # Pin setuptools to a version that includes pkg_resources
          echo "setuptools==69.5.1" >> ecommerce/requirements/production.txt

      - name: Install requirements
        run: ECOMMERCE_SOURCE_PATH=../ecommerce make -C ecommerce-nau-extensions requirements

      - name: Install PayGate
        # `nau_extensions` imports paygate lazily and copes with its absence, but
        # the tests of the payment-status endpoint import it directly.
        run: pip install -e ecommerce-plugin-paygate

      - name: Run unit tests
        run: ECOMMERCE_SOURCE_PATH=../ecommerce make -C ecommerce-nau-extensions test

      - name: Run lint
        run: ECOMMERCE_SOURCE_PATH=../ecommerce make -C ecommerce-nau-extensions lint

      - name: Install gettext package
        run: sudo apt-get install -y gettext

      - name: Extract translations and detect changed source translations
        run: make -C ecommerce-nau-extensions extract_translations detect_changed_source_translations
